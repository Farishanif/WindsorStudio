<!-- Floating Action Button Bubble -->
<button class="chat-bubble-btn" (click)="toggleChat()">
  <span *ngIf="!isOpen">💬</span>
  <span *ngIf="isOpen">✖</span>
</button>

<!-- Slide-up Chat Panel View Window -->
<div class="chat-panel" *ngIf="isOpen">
  <div class="chat-header">
    <h3>Windsor Assistant</h3>
  </div>

  <!-- ADDED #chatBody HERE SO TYPESCRIPT CAN FIND IT -->
  <div class="chat-body" #chatBody>
    <ng-container *ngFor="let msg of chatHistory">
      <div *ngIf="msg.role !== 'system'" [ngClass]="['msg-row', msg.role]">
        <div class="msg-bubble">{{ msg.content }}</div>
      </div>
    </ng-container>

    <div *ngIf="isLoading" class="msg-row assistant">
      <div class="msg-bubble typing">Thinking...</div>
    </div>
  </div>

  <div class="chat-footer">
    <input 
      type="text" 
      [(ngModel)]="userInput" 
      (keyup.enter)="sendMessage()" 
      placeholder="Ask a question..."
      [disabled]="isLoading"
    />
    <button (click)="sendMessage()" [disabled]="isLoading">Send</button>
  </div>
</div>
